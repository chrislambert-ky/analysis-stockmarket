<!DOCTYPE html>
<html>
<head>
    <title>V2 Test</title>
</head>
<body>
    <h1>Testing V2 Shared Module</h1>
    <div id="result">Loading...</div>
    
    <script src="../js/v2-shared.js?v=3"></script>
    <script>
        console.log('Script starting...');
        document.getElementById('result').textContent = 'Script is running!';
        
        console.log('window.V2Shared:', window.V2Shared);
        
        if (window.V2Shared) {
            console.log('V2Shared loaded successfully!');
            document.getElementById('result').textContent = 'V2Shared loaded! Available functions: ' + Object.keys(window.V2Shared).join(', ');
            
            // Test getTickerSymbols
            window.V2Shared.getTickerSymbols().then(tickers => {
                console.log('Tickers:', tickers);
                document.getElementById('result').textContent += '\n\nTickers: ' + tickers.join(', ');
            }).catch(err => {
                console.error('Error loading tickers:', err);
                document.getElementById('result').textContent += '\n\nError: ' + err.message;
            });
        } else {
            console.error('V2Shared NOT loaded!');
            document.getElementById('result').textContent = 'ERROR: V2Shared not loaded!';
        }
    </script>
</body>
</html>
