name: Daily ETL-v2 and Data Commit

on:
  schedule:
    # Runs every day at 23:00 UTC which corresponds to 19:00 (7:00 PM) US Eastern local time during DST
    - cron: "0 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write  # allow pushing updates back to the repo

concurrency:
  group: etl-daily-v2
  cancel-in-progress: false

jobs:
  run-etl-v2:
    name: Run ETL-v2 and commit data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run ETL v2 script
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          echo "Running ETL v2 script..."
          python etl-market-data-v2.py

      - name: Show data directory (post-ETL)
        run: |
          echo 'Listing data/ (top-level):'
          ls -la data || true
          echo 'Recursive listing (first 200 lines):'
          ls -R data | head -n 200 || true

      - name: Validate generated data
        run: |
          echo 'Running data validation script...'
          python scripts/validate_index.py
          echo 'Copying report to workspace for debug'
          ls -la data || true
          cat data/data_report.json || true

      - name: Upload data report artifact
        uses: actions/upload-artifact@v4
        with:
          name: data-report-v2
          path: data/data_report.json

      - name: Commit and push changes (data folder only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage all changes under data/ (including deletions)
          git add -A data/
          echo 'Staged files (git status --porcelain):'
          git status --porcelain data/ || true
          # Show names of staged files
          echo 'Staged file list:'
          git diff --name-only --cached || true
          # Commit only if there are staged changes
          if [ -n "$(git diff --cached --name-only)" ]; then
            git commit -m "Daily ETL-v2: update data ($(date -u +'%Y-%m-%d %H:%M:%S') UTC)"
            echo 'Pushing changes...'
            git push
          else
            echo "No changes to commit in data/"
          fi
